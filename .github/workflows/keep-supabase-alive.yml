name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 09:17 UTC
    # Supabase pauses after 7 days of inactivity - 3 days gives comfortable margin
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REFS: "trnqtxssbntqnyknjfdh"
    steps:
      - name: Validate Secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]     && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && MISSING="$MISSING SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$MISSING" ]; then
            echo "❌ Secrets ausentes:$MISSING"
            exit 1
          fi
          echo "✅ Secrets OK."

      - name: Ping Database & Keep Alive
        run: |
          OVERALL_SUCCESS=true

          for PROJECT_REF in $SUPABASE_PROJECT_REFS; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Projeto: $PROJECT_REF"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Build URL from PROJECT_REF so it always matches the project being pinged
            SUPABASE_REST_URL="https://${PROJECT_REF}.supabase.co"

            # Ping the REST API to generate activity and reset Supabase's inactivity timer
            # '|| echo "000"' prevents bash -eo pipefail from killing the script on curl errors
            echo "📡 Pingando banco para resetar timer de inatividade..."
            ping_http=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 20 \
              -X GET \
              "${SUPABASE_REST_URL}/rest/v1/" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Accept: application/json" || echo "000")

            echo "📡 Ping status: HTTP $ping_http"

            if [ "$ping_http" -ge 200 ] 2>/dev/null && [ "$ping_http" -lt 300 ] 2>/dev/null; then
              echo "✅ Banco respondendo! Timer de inatividade resetado."
              continue
            fi

            # FALLBACK: Ping failed - project might be paused. Check & restore.
            echo "⚠️ Ping falhou (HTTP $ping_http). Verificando status via Management API..."

            status_response=$(curl -s --max-time 30 \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF" || echo "{}")

            echo "📄 Resposta da API: $status_response"

            project_status=$(echo "$status_response" | jq -r '.status // empty' 2>/dev/null)
            project_name=$(echo "$status_response"   | jq -r '.name   // empty' 2>/dev/null)

            # Fallback to grep if jq is unavailable
            [ -z "$project_status" ] && project_status=$(echo "$status_response" | grep -oP '"status"\s*:\s*"\K[^"]+' | head -1)
            [ -z "$project_name"   ] && project_name=$(echo   "$status_response" | grep -oP '"name"\s*:\s*"\K[^"]+'   | head -1)

            echo "📌 Status: '$project_status' ($project_name)"

            if [ "$project_status" = "INACTIVE" ] || [ "$project_status" = "PAUSED" ]; then
              echo "🔄 Projeto pausado! Restaurando automaticamente..."

              restore_response=$(curl -s -w "\n%{http_code}" \
                --max-time 60 \
                -X POST \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d '{}' \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" || echo -e "{}\n000")

              restore_http=$(echo "$restore_response" | tail -1)
              restore_body=$(echo "$restore_response" | head -1)
              echo "📄 Restauração (HTTP $restore_http): $restore_body"

              if [ "$restore_http" -ge 200 ] 2>/dev/null && [ "$restore_http" -lt 300 ] 2>/dev/null; then
                echo "🚀 Restauração iniciada! O projeto ficará ativo em poucos minutos."
              else
                echo "❌ Falha na restauração! HTTP $restore_http"
                OVERALL_SUCCESS=false
              fi

            elif [ "$project_status" = "RESTORING" ] || [ "$project_status" = "COMING_UP" ]; then
              echo "⏳ Projeto em restauração ($project_status). Aguarde a próxima execução."
            elif [ -z "$project_status" ]; then
              echo "❌ Não foi possível obter o status. Resposta: $status_response"
              OVERALL_SUCCESS=false
            else
              echo "❌ Status inesperado: '$project_status'. Investigar manualmente."
              OVERALL_SUCCESS=false
            fi
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "$OVERALL_SUCCESS" = "true" ]; then
            echo "✅ Concluído! $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          else
            echo "❌ Falhou. Verifique os logs acima."
            exit 1
          fi
